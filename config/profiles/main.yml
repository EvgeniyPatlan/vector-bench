# Main profile — the one to actually run.
#
# `full` exists to describe the complete measurement space. On real hardware
# that space is about 22 days for three engines across four datasets and two
# resource passes, because MHNSW and VIDX build their graphs incrementally and
# the cost rises steeply with M: on glove-100, M=8 loads at ~320 rows/s and
# M=32 at ~70. This profile is what fits in a day and still answers the
# questions the smoke run raised. Expect roughly two days for the normalized
# pass across all three engines; AliSQL dominates it at ~55 rows/s ingest.
#
# Differences from `full`:
#   * two datasets, not four   — glove-100 (angular) and sift-128 (euclidean)
#                                cover both metric spaces at 1M scale. gist-960
#                                is dropped: at 960 dims it alone is ~19 h of
#                                loading per phase.
#   * concurrency to 32 clients — the smoke run's most striking result was
#                                MariaDB saturating at 2 clients; this is where
#                                that gets confirmed or overturned.
#   * each point three times     — 6 points x 30 s x 3 is ~9 minutes per
#                                engine-dataset pair plus warm-up, which buys
#                                an error bar on the one measurement here that
#                                has been seen to move 21% between windows.
#   * filtered at 1/10/50%      — 1% is back. It measured 0.9 QPS on MariaDB
#                                against 326 unfiltered, so 2000 queries there
#                                cost 37 minutes for one point; what makes it
#                                affordable now is `filtered_budget_s`, which
#                                caps every point at five minutes and records
#                                what it managed instead of running until it
#                                finishes. The low-selectivity case is where
#                                pre-filtering, post-filtering and index
#                                iteration actually diverge, so omitting it
#                                dropped the measurement this dimension is for.
#   * both filter columns        — `tag` and `ctag`, which doubles the number
#                                of filtered points. `ctag` follows the vector
#                                space, so it is the one that shows an engine
#                                abandoning a query; `tag` is the control.
#   * fewer filtered queries    — 500, not 2000. At sub-1 QPS the query count
#                                is the whole cost.
name: main
description: Two datasets at 1M scale, both metric spaces (~2 days, normalized pass)

datasets:
  - glove-100-angular
  - sift-128-euclidean

k: 10
runs: 2

ann:
  enabled: true
  # M=32 is where the high-recall end of the frontier lives and it is also
  # ~65% of the grid's load cost. Keep it; drop the middle instead if you need
  # to cut further.
  m_values: [8, 32]
  ef_search: [10, 20, 40, 80, 160, 320]
  pgvector_ef_construction: 200
  pgvector_build_modes: [post, incremental]
  batch: false
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  workloads: [build, concurrency, filtered, churn]
  # One M for the ops dimensions. Build cost, concurrency and churn are about
  # engine behaviour, not about sweeping the index parameter — and each extra M
  # here costs another full load of a million rows.
  m_values: [16]
  ef_search: 100
  subset_rows: null
  load_threads: 1
  max_queries: 500
  client_counts: [1, 2, 4, 8, 16, 32]
  concurrency_duration_s: 30
  # Three windows per point, and the median reported with the spread beside
  # it. Every figure in this framework was a single sample until a Valkey
  # point was re-measured by accident, five hours later on the same build and
  # configuration, and came back 21% higher at sixteen and thirty-two clients.
  # Concurrency is the headline finding, the noisiest measurement here, and
  # the cheapest to repeat: 6 points x 30 s x 3 is 9 minutes per
  # engine-dataset pair plus warm-up, against the ~51 h of ingest this
  # profile pays before a single query runs. Two engines differing by less
  # than the window-to-window spread were being presented as ordered.
  #
  # `concurrency_queries` is deliberately NOT set. It defaults to the whole
  # test set (10,000 queries for both datasets here); setting it is the way
  # BACK to a small pool, which measures every graph cache against a hot set
  # it can hold entirely and erases the difference the concurrency chart
  # exists to show. It exists for reproducing a pre-version-3 run, not for
  # tuning this one.
  concurrency_repeats: 3
  # All three, 1% included. It was dropped because it cost 37 minutes per
  # configuration on MariaDB at 0.9 QPS with nothing bounding the loop; the
  # budget below is what bounds it, so the cost of the point is now five
  # minutes whatever the engine does inside them and the record says how many
  # of the 500 queries it managed. A truncated point is greyed out in the
  # report rather than averaged in.
  selectivities: [0.01, 0.10, 0.50]
  # Five minutes per (column, selectivity, iterative-scan mode) point. The
  # worst case this profile can reach per engine-dataset is 2 columns x 3
  # selectivities x 1 mode x 300 s = 30 minutes, against the ~51 h of ingest
  # it pays before a single query runs. Without it the same grid was
  # unbounded: the run estimate printed its shape and refused to call the
  # total a ceiling, which is the honest thing to print and a bad thing to
  # have to.
  #
  # One mode, not two. `pgvector_iterative_scan` below declares two and
  # `cli.py:_ops_iterative_scan` pins the first, so the grid runs once; the
  # workload loops whatever it is handed. If that call site is ever changed to
  # pass the whole list, this worst case doubles for pgvector alone and the
  # estimate's filtered term has to gain the factor with it.
  filtered_budget_s: 300
  churn_fractions: [0.10, 0.25]
  # PR 4 §4.3. Readers querying the index while the churn writer re-inserts,
  # so the churn section reports what a read costs under writes rather than
  # what it costs in a maintenance window with nothing else touching the
  # index. Stated rather than left to the harness default because this is the
  # headline profile and the figure it publishes -- p99 under writes over
  # baseline p99 -- is only interpretable beside the number of readers that
  # produced it.
  #
  # The cost is a 30 s baseline reader window before each step's deletes, per
  # churn fraction per ops unit; the readers themselves run concurrently with
  # a re-insert that was going to happen anyway and add no wall clock of their
  # own. `ops.churn_readers: 0` is the write-only pass.
  churn_readers: 4
  pgvector_iterative_scan: [off, relaxed_order]
