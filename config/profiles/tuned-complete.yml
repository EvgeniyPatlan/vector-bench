# Everything, in one run, under one configuration.
#
# Every engine, both MariaDB versions, both storage engines where the engine has
# them, all five measurements: recall against throughput, index build cost,
# concurrency, filtered search and churn.
#
# WHY ONE RUN RATHER THAN SEVERAL
#
# The results we have are spread across two runs with different resource
# splits, and every cross-run comparison carries a caveat. Concurrency,
# filtered search and churn were measured only under the equal-budget pass on
# InnoDB, before MyISAM turned out to be worth 84% on single-client throughput.
# Recall and build cost came from the tuned pass with eight client cores, which
# is too few to drive 32 concurrent clients without the client itself becoming
# the bottleneck.
#
# So the open questions cannot be answered by adding to what exists:
#
#   * Does MyISAM lift MariaDB's concurrency ceiling? It was flat at ~170 QPS
#     from two clients through thirty-two, measured on InnoDB. MyISAM removes
#     row locks, redo, doublewrite and buffer-pool latching, which are the
#     obvious causes.
#   * Does MyISAM change churn? MariaDB lost 83% of its throughput after 10%
#     churn, and MyISAM handles deletes completely differently.
#   * Does it change filtered search? That was InnoDB-only too.
#
# Measuring MyISAM here against InnoDB there would attribute to the storage
# engine a difference that is partly the resource budget. One run, one split,
# both storage engines, and the differences mean something.
#
# COST. Roughly 45 hours, about two days. Nearly all of it is loading: the ann
# and ops phases each load the corpus independently, and six configurations
# times two phases is twelve loads. There is no way around that -- an ops unit
# builds its own volume, loads, measures and tears down, so nothing can be
# shared with a phase that ran earlier.
#
# Run it with:
#   ./run-benchmark.sh run --profile tuned-complete \
#       --engines mariadb,mariadb123,alisql,pgvector
#
# If two days is too long, --engines mariadb,alisql,pgvector drops MariaDB 12.3
# and saves about 13 h. It still answers every question above on 11.8, which is
# the version the earlier concurrency numbers came from.
name: tuned-complete
description: Every engine, both storage engines, all five measurements, one configuration (~45 h)

datasets:
  - dbpedia-openai-1000k-angular

k: 10
runs: 1
default_resource_pass: tuned

resources:
  cpu:
    client_cpus: 16
  # No extras override: the tuned pass sweeps InnoDB and MyISAM, and both are
  # wanted here so the comparison is within one run and one budget.

ann:
  # On, so recall lands in the same run and the same CPU split as everything
  # else. The curves exist already in mariadb-blog-repro, but that run used
  # eight client cores against sixteen here, which changes server_cpu_count and
  # therefore the results fingerprint. Reusing them would mean one report whose
  # recall came from a different machine shape than its concurrency.
  enabled: true
  m_values: [16]
  ef_search: [10, 20, 40, 80, 120, 200, 400, 800]
  insert_threads: 8
  mariadb_storage_engines: [InnoDB, MyISAM]

ops:
  enabled: true
  workloads: [build, concurrency, filtered, churn]
  m_values: [16]
  ef_search: 100
  subset_rows: null
  load_threads: 8
  max_queries: 500
  # The same grid the equal-budget run used, so the two are directly
  # comparable. The knee is between 1 and 4, which is why those points are all
  # present.
  client_counts: [1, 2, 4, 8, 16, 32]
  concurrency_duration_s: 60
  selectivities: [0.10, 0.01]
  churn_fractions: [0.10]
