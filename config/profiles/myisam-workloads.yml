# Does MyISAM lift MariaDB's concurrency ceiling?
#
# The equal-budget run measured MariaDB flat at ~170 QPS from two clients
# through thirty-two, with p99 climbing to 1.2 seconds. That is the most
# dramatic result we have, and it was measured on InnoDB.
#
# MyISAM removes most of the obvious explanations at once: no row locks, no
# redo, no doublewrite, no buffer-pool latching. It also turned out to be worth
# 84% on single-client throughput, so the configuration the ceiling was measured
# under is not the one MariaDB is fastest in. If MyISAM scales past two clients
# the finding needs rewriting; if it does not, the finding gets much stronger,
# because the obvious cause has been eliminated.
#
# Churn is here for the same reason. MariaDB losing 83% of its throughput after
# 10% churn is the number that matters most to anyone with a write workload, and
# MyISAM handles deletes completely differently.
#
# WHY THIS IS A SEPARATE PROFILE
#
# Adding workloads to mariadb-blog-repro and resuming does not work. The ops
# phase is checkpointed per (M, build_mode, storage engine) and the workload set
# is not part of that key, so an already-complete unit is skipped no matter what
# is asked of it. Clearing the checkpoints re-runs every engine on both storage
# engines: about eighteen hours of loading to answer a question about one
# configuration.
#
# This profile loads MariaDB on MyISAM only, once per version, and runs every
# workload against it. Roughly two hours rather than eighteen.
#
# Run it with:
#   ./run-benchmark.sh run --profile myisam-workloads --engines mariadb,mariadb123
name: myisam-workloads
description: MariaDB on MyISAM across all workloads — does the concurrency ceiling move? (~2 h)

datasets:
  - dbpedia-openai-1000k-angular

k: 10
runs: 1
default_resource_pass: tuned

resources:
  cpu:
    client_cpus: 16
  extras:
    # Overrides the tuned pass, which sweeps both. Measuring InnoDB again would
    # add 3.6 h for MariaDB and 5.7 h for 12.3 to re-confirm numbers we already
    # have.
    mariadb_storage_engines: [MyISAM]

ann:
  # The recall curves for these configurations are already measured in
  # mariadb-blog-repro and nothing here changes them.
  enabled: false
  m_values: [16]
  ef_search: [10, 20, 40, 80, 120, 200, 400, 800]
  insert_threads: 8
  mariadb_storage_engines: [MyISAM]

ops:
  enabled: true
  workloads: [build, concurrency, filtered, churn]
  m_values: [16]
  ef_search: 100
  subset_rows: null
  load_threads: 8
  max_queries: 500
  # The same grid the equal-budget run used, so the two are directly
  # comparable. The knee is between 1 and 4, which is why those points are all
  # present.
  client_counts: [1, 2, 4, 8, 16, 32]
  concurrency_duration_s: 60
  selectivities: [0.10, 0.01]
  churn_fractions: [0.10]
