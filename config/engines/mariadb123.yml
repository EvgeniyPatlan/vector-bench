# MariaDB 12.3 — the version MariaDB's own published benchmark leads with.
#
# Identical to config/engines/mariadb.yml in every respect except the source
# tag and the image names. It exists as a separate engine rather than as a
# retagged `mariadb` for one reason: ann-benchmarks keys its result files on
# the algorithm name and its index parameters, and knows nothing about which
# build produced them. Swapping the tag in place would make a 12.3 run find
# 11.8.8's result files, report "nothing to run", and hand back the old
# numbers in seconds. A distinct name gives it a distinct results tree.
#
# The article reports 850-1000 QPS at 94% recall for 12.3, and says only that
# 11.8 is "slower" without quantifying it. Running both here quantifies it.
#
# `alias_of` tells the shell scripts which source-preparation routine, docker
# build context and tag build-arg to reuse, so a new version costs one config
# file rather than a case branch in every script.
alias_of: mariadb

# MariaDB engine definition.
#
# Vector support: MHNSW (sql/vector_mhnsw.cc), GA since the 11.7/11.8 series.
name: mariadb123
display_name: MariaDB 12.3
family: mysql

source:
  tag: mariadb-12.3.2
  upstream: https://github.com/MariaDB/server.git
  # `git archive` cannot carry submodules and the local checkout has none
  # populated, so prepare-sources.sh clones and initialises only these.
  # Everything else (columnstore, rocksdb, wsrep, wolfssl, marias3, duckdb)
  # is disabled in the build and deliberately not fetched.
  submodules: libmariadb

image:
  runtime: vector-bench/mariadb123-runtime
  bench: vector-bench/mariadb123-bench
  base: ubuntu:24.04

build:
  type: RelWithDebInfo
  # -march for the distance kernels. `native` gives the engine its best shot but
  # makes the image non-portable; x86-64-v3 (AVX2/FMA) is the portable default.
  # Set to `native` in the tuned pass on the machine that will run the benchmark.
  march: x86-64-v3
  cmake_flags:
    - -DPLUGIN_COLUMNSTORE=NO
    - -DPLUGIN_ROCKSDB=NO
    - -DPLUGIN_S3=NO
    - -DPLUGIN_MROONGA=NO
    - -DPLUGIN_CONNECT=NO
    - -DPLUGIN_SPIDER=NO
    - -DPLUGIN_OQGRAPH=NO
    - -DPLUGIN_SPHINX=NO
    - -DPLUGIN_TOKUDB=NO
    - -DPLUGIN_PERFSCHEMA=NO
    - -DWITH_WSREP=OFF
    - -DWITH_UNIT_TESTS=OFF
    - -DWITH_EMBEDDED_SERVER=OFF
    - -DWITH_SSL=system
    - -DWITH_ZLIB=system

# How this engine expresses vector search. Consumed by the ops-harness driver
# and by the doc generator so the manual instructions never drift from the code.
sql:
  # Session setup executed on every connection before any vector work.
  session_setup:
    - "SET SESSION default_storage_engine = InnoDB"
  # {dim}, {metric}, {m}, {engine} are substituted by the driver.
  create_table: |
    CREATE TABLE {table} (
      id INT PRIMARY KEY,
      v VECTOR({dim}) NOT NULL,
      VECTOR INDEX (v) M={m} DISTANCE={metric}
    ) ENGINE={engine}
  # MariaDB accepts a raw little-endian float32 binary string for VECTOR.
  insert: "INSERT INTO {table} (id, v) VALUES (%s, %s)"
  vector_binding: binary_f32
  query: "SELECT id FROM {table} ORDER BY vec_distance_{metric}(v, %s) LIMIT {k}"
  query_filtered: "SELECT id FROM {table} WHERE tag < %s ORDER BY vec_distance_{metric}(v, %s) LIMIT {k}"
  set_ef_search: "SET mhnsw_ef_search = {ef_search}"
  explain: "EXPLAIN {query}"
  # A plan is only accepted if this appears in EXPLAIN output. Guards against
  # silently benchmarking a brute-force scan.
  index_plan_marker: "v"
  metrics:
    angular: cosine
    euclidean: euclidean

# Server knobs, per fairness pass. {mem_bytes} etc. are filled by the harness.
server:
  common:
    # --no-defaults is NOT listed here. mariadbd/mysqld require it to be
    # the first argument; the entrypoint supplies it there, and a second
    # copy arriving later makes the server exit 2 at startup.
    # --skip-grant-tables is deliberately absent. On MySQL 8 (and therefore
    # AliSQL) it implicitly enables --skip-networking, which would leave the
    # server unreachable over TCP from the harness container. Both MySQL-family
    # engines run with grants enabled and create the bench account from an
    # --init-file, so their startup and auth paths are identical.
    - --skip-name-resolve
  normalized:
    - --innodb-buffer-pool-size={buffer_bytes}
    - --mhnsw-max-cache-size={graph_cache_bytes}
    - --innodb-flush-log-at-trx-commit=2
    - --innodb-doublewrite=0
    - --transaction-isolation=READ-COMMITTED
  tuned:
    - --innodb-buffer-pool-size={buffer_bytes}
    - --mhnsw-max-cache-size={graph_cache_bytes}
    - --innodb-flush-log-at-trx-commit=0
    - --innodb-doublewrite=0
    - --innodb-flush-method=O_DIRECT
    - --skip-log-bin

# Storage engines to test. InnoDB only: MyISAM is faster on every axis we
# measured but is not transactional, so it is not a configuration vector search
# gets deployed on. The framework still supports sweeping it -- add MyISAM here
# and in the tuned resource pass -- and the report keeps its per-storage
# handling so existing results stay readable.
storage_engines:
  normalized: [InnoDB]
  tuned: [InnoDB]

capabilities:
  ef_construction_tunable: false
  m_per_index: true
  requires_read_committed: false
  filtered_search: true

# Runtime facts the orchestrator needs to start and speak to this engine.
#
# These used to be six dictionaries keyed by engine name, spread across
# ann_pass, ops_pass, cli, charts and render. Adding an engine meant finding all
# six, and missing one produced a failure hours later rather than at load. They
# live here because everything else about an engine already does.
runtime:
  # Which harness driver drives it. A new *architecture* needs a new
  # driver in harness/drivers/; a new variant of this family does not.
  # Presentation and iteration order. Discovery is by directory, which is
  # alphabetical, and alphabetical is not the order this comparison is read
  # in -- the original three come first.
  order: 40
  driver: MariaDBDriver
  # Class name ann-benchmarks expects in the generated config.yml.
  ann_constructor: MariaDB123
  port: 3306
  # Where the server keeps its data inside the image.
  data_mount: /var/lib/vbench
  server_data_mount: /server-data/data
  credentials:
    user: "bench"
    password: "bench"
  # Opt-in engines are not in the original three-way comparison.
  group: extra
  # Readiness probe, run inside the server container until it succeeds.
  probe:
    - "sh"
    - "-c"
    - "/opt/mariadb/bin/mariadb -ubench -pbench --socket=/var/run/vbench/mariadb.sock -e 'SELECT 1' >/dev/null 2>&1"
  chart:
    color: "#5fa8d3"
    marker: "s"
    linestyle: "--"
    label: "MariaDB 12.3 (MHNSW)"
  label: "MariaDB 12.3 (MHNSW)"
