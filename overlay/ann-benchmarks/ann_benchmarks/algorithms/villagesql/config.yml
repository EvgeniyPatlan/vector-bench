# Default (full-profile) VillageSQL sweep.
#
# scripts/render-configs.py overwrites this file in the working copy according to
# the selected profile, so editing it here only changes the standalone default.
#
# `M` and `efConstruction` are index options (`WITH (M = .., ef_construction =
# ..)`). efConstruction is pinned at 200, the value every other engine with the
# knob is built at; the extension refuses ef_construction > 32 x M, so at M=6
# the module builds at 192 and records both values. The ef_search grid matches
# every other engine's; the scan searches at max(ef_search, k).
#
# At the pinned build no query reaches the index (see
# harness/drivers/villagesql.py) and the module refuses to time a full scan,
# so this sweep produces no recall/QPS points until that changes.
float:
  any:
  - base_args: ['@metric']
    constructor: VillageSQL
    disabled: false
    docker_tag: vector-bench/villagesql-bench
    module: ann_benchmarks.algorithms.villagesql
    name: villagesql
    run_groups:
      innodb:
        arg_groups: [{M: [6, 8, 16, 24, 32], efConstruction: [200]}]
        args: {}
        query_args: [[10, 20, 40, 80, 120, 200, 400, 800]]
