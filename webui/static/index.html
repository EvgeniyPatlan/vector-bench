<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vector-bench</title>
<link rel="stylesheet" href="/vendor/uPlot.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>vector-bench</h1>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="explore">Explore</button>
    <button data-tab="report">Report</button>
    <button data-tab="configure" data-control="1">Configure</button>
    <button data-tab="jobs" data-control="1">Jobs</button>
  </nav>
  <span class="badge" id="control-badge"></span>
</header>

<div class="layout">
  <aside class="sidebar">
    <input type="search" id="run-filter" placeholder="filter runs…" autocomplete="off">
    <ul id="run-list" class="run-list"></ul>
  </aside>

  <main id="main">
    <section id="panel-overview" class="panel"></section>

    <section id="panel-explore" class="panel" hidden>
      <div id="facets" class="facets"></div>
      <div class="chart-controls">
        <label>X <select id="axis-x"></select></label>
        <label>Y <select id="axis-y"></select></label>
        <label>Group <select id="group-by">
          <option value="engine">engine</option>
          <option value="engine,dataset">engine + dataset</option>
          <option value="engine,m">engine + M</option>
          <option value="engine,resource_pass">engine + pass</option>
          <option value="engine,build_mode">engine + build mode</option>
        </select></label>
        <label class="check"><input type="checkbox" id="log-y"> log Y</label>
        <span id="match-count" class="muted"></span>
      </div>
      <div id="chart" class="chart"></div>
      <div id="table-wrap" class="table-wrap"></div>
    </section>

    <section id="panel-report" class="panel" hidden></section>

    <section id="panel-configure" class="panel" hidden></section>

    <section id="panel-jobs" class="panel" hidden></section>
  </main>
</div>

<script src="/vendor/uPlot.iife.min.js"></script>
<script src="/app.js"></script>
<script src="/explore.js"></script>
<script src="/control.js"></script>
</body>
</html>
